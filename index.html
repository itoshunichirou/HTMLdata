<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>自己紹介ページ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>自己紹介</h1>
  <h2>プロフィール</h2>
  <p>こんにちは。私の自己紹介ページです。。</p>
  <dl>
    <dt>名前</dt>
    <dd>伊藤 隼一郎</dd>
    <dt>好きなもの</dt>
    <dd class="favorite">ゲームとアニメ鑑賞</li></dd>
    <dt>趣味</dt>
    <dd>ゲームをすること</dd>
  </dl>
  <h2>1週間の予定</h2>
  <table>
    <tr>
      <th>曜日</th>
      <th>学校</th>
      <th>放課後の予定</th>
    </tr>
    <tr>
      <th>月曜日</th>
      <td>授業</td>
      <td>アルバイト</td>
    </tr>
    <tr>
      <th>火曜日</th>
      <td>授業</td>
      <td>アニメ鑑賞</td>
    </tr>
    <tr>
      <th>水曜日</th>
      <td>授業</td>
      <td>ゲーム</td>
    </tr>
    <tr>
      <th>木曜日</th>
      <td>授業</td>
      <td>アルバイト</td>
    </tr>
    <tr>
      <th>金曜日</th>
      <td>授業</td>
      <td>友達と過ごす</td>
    </tr>
    <tr>
      <th>土曜日</th>
      <td>休み</td>
      <td>ゲーム</td>
    </tr>
    <tr>
      <th>日曜日</th>
      <td>休み</td>
      <td>家でゆっくりする</td>
    </tr>
  </table>
  <h2>このページの感想を送る</h2>
  <form method="get">
    <dl>
      <dt><label for="visitor-name">お名前</label></dt>
      <dd><input type="text" id="visitor-name" name="visitor-name" required placeholder="ねこ太郎"></dd>
      <dt>いちばんよかったところ</dt>
      <dd>
        <label><input type="radio" name="best" value="profile">プロフィール</label>
        <label><input type="radio" name="best" value="table">予定の表</label>
        <label><input type="radio" name="best" value="form">感想フォーム</label>
      </dd>
      <dt><label for="comment">感想</label></dt>
      <dd><textarea id="comment" name="comment" rows="4"></textarea></dd>
    </dl>
    <button type="submit">送信する</button>
  </form>
</body>
</html>
